<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NAV — the self-hostable cloud for shipping web services, workers, cron jobs, static sites and Postgres from Git." />
    <meta name="theme-color" content="#0b0b0c" />
    <title>NAV — ship from Git, run anywhere</title>
    <style>html,body{background:#0b0b0c;color:#f4f4f5}html[data-theme=light],html[data-theme=light] body{background:#f7f7f8;color:#0a0a0b}</style>
    <script>
      try {
        var t = localStorage.getItem('nav.theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
